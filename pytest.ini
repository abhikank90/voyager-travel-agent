[pytest]
# Pytest configuration for Voyager Travel Agent

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11

# Command line options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    # Coverage options
    --cov=agents
    --cov=graph
    --cov=api
    --cov=config
    --cov-report=term-missing
    --cov-report=html:coverage_report/html
    --cov-report=json:coverage_report/coverage.json
    --cov-report=xml:coverage_report/coverage.xml
    # Fail if coverage is below threshold (raise as test suite improves)
    --cov-fail-under=40

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (require API keys)
    unit: marks tests as unit tests (no external dependencies)
    asyncio: marks async tests

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    node_modules
    frontend

# Async support
asyncio_mode = auto

# Output
console_output_style = progress

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
